<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>URDealer — Chat</title>
<style>
  :root{
    --bg:#0a0c10; --panel:#12151c; --panel2:#171b24; --line:#232833;
    --ink:#e8eaf0; --dim:#9aa3b2; --faint:#5d6575;
    --olive:#a8bf6a; --olive2:#7d9b3f; --amber:#e0a83e; --red:#e05d5d; --cyan:#57b7c7;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  body{background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif; height:100dvh; display:flex; flex-direction:column}
  header{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--panel)}
  .mark{width:34px; height:34px; border-radius:10px; background:linear-gradient(140deg,var(--olive),var(--olive2)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#101408}
  header h1{font-size:17px; font-weight:750}
  header .sub{font-size:12px; color:var(--faint)}
  .spacer{flex:1}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--dim)}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--faint); display:inline-block}
  .dot.live{background:var(--olive); box-shadow:0 0 7px var(--olive)} .dot.recent{background:var(--amber)} .dot.down{background:var(--red)}
  #agents{display:flex; gap:8px; padding:10px 12px; overflow-x:auto; background:var(--panel); border-bottom:1px solid var(--line); scrollbar-width:none}
  #agents::-webkit-scrollbar{display:none}
  .chipbtn{flex:none; display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-weight:650; font-size:14px}
  .chipbtn.sel{border-color:var(--olive2); background:#1d2612; color:#eaf3cf}
  .chipbtn .av{width:22px; height:22px; border-radius:7px; background:#232833; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--olive)}
  #thread{flex:1; overflow-y:auto; padding:14px 12px 8px; display:flex; flex-direction:column; gap:9px}
  .msg{max-width:86%; padding:10px 13px; border-radius:16px; font-size:14.5px; word-wrap:break-word}
  .msg .meta{font-size:11px; color:var(--faint); margin-bottom:3px}
  .msg.them{align-self:flex-start; background:var(--panel2); border:1px solid var(--line); border-bottom-left-radius:5px}
  .msg.me{align-self:flex-end; background:#26331a; border:1px solid #33471f; border-bottom-right-radius:5px}
  .msg.sys{align-self:center; background:none; border:none; color:var(--faint); font-size:12.5px; text-align:center}
  #composer{display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--panel)}
  #text{flex:1; padding:12px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); outline:none; font-size:15px}
  #text:focus{border-color:var(--olive2)}
  #send{width:46px; height:46px; flex:none; border:none; border-radius:50%; background:var(--olive); color:#101408; font-size:18px; font-weight:800}
  #gate{position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; padding:22px; text-align:center}
  #gate .in{max-width:340px}
  #gate a{display:inline-block; margin-top:14px; padding:12px 22px; background:var(--olive); color:#101408; font-weight:750; border-radius:11px; text-decoration:none}
  .lane-note{font-size:11.5px; color:var(--faint); text-align:center; padding:0 14px 4px}
</style>
</head>
<body>
<header>
  <div class="mark">UR</div>
  <div>
    <h1>URDealer</h1>
    <div class="sub">Every agent. One chat.</div>
  </div>
  <div class="spacer"></div>
  <span class="pill"><span class="dot" id="live-dot"></span><span id="live-txt">connecting…</span></span>
</header>

<div id="agents"></div>
<div class="lane-note" id="lane-note"></div>
<div id="thread"></div>

<form id="composer">
  <input id="text" type="text" placeholder="Message…" autocomplete="off" enterkeyhint="send">
  <button id="send" type="submit" aria-label="Send">↑</button>
</form>

<div id="gate"><div class="in">
  <div class="mark" style="margin:0 auto 14px; width:52px; height:52px; font-size:18px; border-radius:14px">UR</div>
  <h2>Sign in first</h2>
  <p style="color:var(--dim); margin-top:8px">URDealer chat uses your Fleet Command session. Sign in once on the office board, then come back here.</p>
  <a href="/">Open URDealer Office</a>
</div></div>

<script>
const AGENTS = [
  {id:"all",      name:"Everyone",  lane:"The whole floor — broadcast view"},
  {id:"zait",     name:"Zait",      lane:"OPC-1 · product shelf"},
  {id:"qadir",    name:"Qadir",     lane:"QadirOS · sales"},
  {id:"amanecer", name:"Amanecer",  lane:"Site + X · distribution"},
  {id:"aisha",    name:"Aisha",     lane:"Orchestration · CEO desk"},
  {id:"asred",    name:"Asred",     lane:"Money-in leads · sweeps"},
  {id:"mcode",    name:"Muse", lane:"Builds · Muse"},
];
let session = localStorage.getItem("fc_session") || "";
let current = "all";
let state = null;

async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers || {});
  if(session) opts.headers["X-Session"] = session;
  const r = await fetch(path, opts);
  return {status:r.status, body: await r.json().catch(()=>({}))};
}

function beatClass(iso){
  if(!iso) return "down";
  const age = (Date.now() - new Date(iso).getTime())/1000;
  if(age < 180) return "live";
  if(age < 3600) return "recent";
  return "down";
}

function renderAgents(){
  const hb = (state && state.heartbeats) || {};
  document.querySelector("#agents").innerHTML = AGENTS.map(a => {
    const cls = a.id === "all" ? "live" : beatClass((hb[a.id]||{}).last_beat);
    return `<button class="chipbtn ${a.id===current?"sel":""}" data-a="${a.id}"><span class="av">${a.name[0]}</span>${a.name}<span class="dot ${cls}"></span></button>`;
  }).join("");
  document.querySelectorAll(".chipbtn").forEach(b => b.addEventListener("click", () => { current = b.dataset.a; renderAll(); }));
  const a = AGENTS.find(x => x.id === current);
  document.querySelector("#lane-note").textContent = a.lane;
  const anyLive = AGENTS.slice(1).some(x => beatClass((hb[x.id]||{}).last_beat) === "live");
  document.querySelector("#live-dot").className = "dot " + (anyLive ? "live" : "recent");
  document.querySelector("#live-txt").textContent = anyLive ? "fleet live" : "fleet quiet";
}

function mine(m){
  const f = (m.from || m.agent || "").toLowerCase();
  return f === "owner" || f === "owner-urdealer" || f === "fleet-command";
}
function inThread(m){
  if(current === "all") return true;
  const f = (m.from || "").toLowerCase(), c = (m.channel || "").toLowerCase(), t = (m.to || m.agent || "").toLowerCase();
  const txt = (m.text || m.message || "").toLowerCase();
  return f === current || c === current || t === current || txt.startsWith("@" + current);
}

function renderThread(){
  const chat = (state && state.chat) || [];
  const items = chat.filter(inThread).slice(-40);
  const el = document.querySelector("#thread");
  if(!items.length){
    el.innerHTML = `<div class="msg sys">No messages here yet.<br>Send one — it lands in ${current === "all" ? "the shared fleet chat" : "their live queue"} instantly.</div>`;
    return;
  }
  el.innerHTML = items.map(m => {
    const who = m.from || m.agent || "agent";
    const when = m.at || m.ts || "";
    const txt = (m.text || m.message || "").replace(/</g,"&lt;");
    return `<div class="msg ${mine(m) ? "me" : "them"}"><div class="meta">${who}${when ? " · " + when : ""}</div>${txt}</div>`;
  }).join("");
  el.scrollTop = el.scrollHeight;
}

function renderAll(){ renderAgents(); renderThread(); }

async function refresh(){
  const st = await api("/api/state");
  if(st.status === 401){ document.querySelector("#gate").style.display = "flex"; return; }
  if(st.status === 200){ state = st.body; renderAll(); }
}

document.querySelector("#composer").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.querySelector("#text");
  const text = input.value.trim();
  if(!text) return;
  const target = current === "all" ? "zait" : current;
  input.value = "";
  const r = await api("/api/send", {method:"POST", body: JSON.stringify({agent: target, text, from: "owner"})});
  if(r.status !== 200){
    state.chat = (state.chat || []).concat([{from:"URDealer", text:"Send failed — " + (r.body.error || r.status)}]);
    renderThread(); return;
  }
  await refresh();
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
